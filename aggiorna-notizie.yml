name: Aggiorna notizie

on:
  schedule:
    - cron: "7,37 * * * *"   # ogni 30 minuti
  workflow_dispatch:          # pulsante "Run workflow" per avviarlo a mano

permissions:
  contents: write

concurrency:
  group: aggiorna-notizie
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leggi i feed delle testate
        run: python aggiorna.py

      - name: Salva l'archivio
        run: |
          git config user.name "contesto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nessuna novità"
          else
            git commit -m "Notizie aggiornate $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash || true
            git push
          fi
